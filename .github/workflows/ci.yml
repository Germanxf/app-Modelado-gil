name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify AWS deployment secret is configured
        env:
          AWS_DEPLOY_ENV: ${{ secrets.AWS_DEPLOY_ENV }}
        run: |
          if [ -n "$AWS_DEPLOY_ENV" ]; then
            echo "AWS_DEPLOY_ENV está configurado."
          else
            echo "::error::Configura el secreto AWS_DEPLOY_ENV en GitHub."
            exit 1
          fi